<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f18"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7fffb2"/>
      <stop offset="100%" style="stop-color:#7fc8ff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Top accent line -->
  <rect x="8" y="7" width="48" height="2.5" rx="1.5" fill="url(#grad)" opacity="0.9"/>

  <!-- Q -->
  <text x="4" y="48" font-family="Georgia, serif" font-size="38" font-weight="700"
    fill="none" stroke="#7fffb2" stroke-width="2.5">Q</text>

  <!-- C -->
  <text x="30" y="48" font-family="Georgia, serif" font-size="38" font-weight="700"
    fill="none" stroke="#7fc8ff" stroke-width="2.5">C</text>

  <!-- Bottom accent line -->
  <rect x="8" y="56" width="48" height="2" rx="1" fill="url(#grad)" opacity="0.6"/>
</svg>
